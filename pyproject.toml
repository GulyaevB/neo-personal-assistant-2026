[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-personal-assistant"
version = "0.1.0"
description = "CLI personal assistant for contacts, birthdays, notes and tags."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["assistant*"]

# T26 adds the `assistant` command.

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: PEP 8 style
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # import sorting
    "N",       # PEP 8 naming
    "B",       # bugbear: common bugs
    "UP",      # modern Python syntax
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
