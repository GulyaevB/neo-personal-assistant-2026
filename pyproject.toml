[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-personal-assistant"
version = "0.1.0"
description = "CLI personal assistant for contacts, birthdays, notes and tags."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prompt_toolkit>=3.0"]

[tool.setuptools.packages.find]
include = ["assistant*"]

